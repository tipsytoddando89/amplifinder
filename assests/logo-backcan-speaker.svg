<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="mesh-dots" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.4" fill="#003d6e" opacity="0.9"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="200" height="160" fill="#050510" rx="12"/>

  <!-- === BACK-CAN ENCLOSURE (cabinet oblique projection) === -->

  <!-- Right side face (darkest — receding) -->
  <polygon points="130,52 148,30 148,112 130,134" fill="#060e1c" stroke="#00aaff" stroke-width="1.1" filter="url(#soft-glow)"/>

  <!-- Top face (medium depth) -->
  <polygon points="35,52 130,52 148,30 53,30" fill="#091525" stroke="#00aaff" stroke-width="1.1" filter="url(#soft-glow)"/>

  <!-- Front face (main visible face) -->
  <rect x="35" y="52" width="95" height="82" rx="2" fill="#0c1e3a" stroke="#00aaff" stroke-width="1.5" filter="url(#soft-glow)"/>

  <!-- Grille cutout on front face -->
  <rect x="50" y="64" width="65" height="58" rx="3" fill="#001428" stroke="#00ccff" stroke-width="1.2"/>
  <!-- Mesh fill -->
  <rect x="52" y="66" width="61" height="54" rx="2" fill="url(#mesh-dots)"/>
  <!-- Grille highlight rim -->
  <rect x="50" y="64" width="65" height="58" rx="3" fill="none" stroke="#00ddff" stroke-width="0.6" filter="url(#neon-glow)"/>

  <!-- Corner screws on front face -->
  <circle cx="41" cy="58" r="1.8" fill="none" stroke="#0066aa" stroke-width="0.9"/>
  <circle cx="124" cy="58" r="1.8" fill="none" stroke="#0066aa" stroke-width="0.9"/>
  <circle cx="41" cy="128" r="1.8" fill="none" stroke="#0066aa" stroke-width="0.9"/>
  <circle cx="124" cy="128" r="1.8" fill="none" stroke="#0066aa" stroke-width="0.9"/>

  <!-- Left bracket arm (folds out to the left) -->
  <g filter="url(#soft-glow)">
    <!-- Horizontal arm -->
    <rect x="7" y="79" width="30" height="7" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <!-- Mounting plate at end -->
    <rect x="5" y="71" width="9" height="23" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <!-- Mounting holes on plate -->
    <circle cx="9.5" cy="77" r="1.8" fill="none" stroke="#00aaff" stroke-width="0.9"/>
    <circle cx="9.5" cy="87" r="1.8" fill="none" stroke="#00aaff" stroke-width="0.9"/>
  </g>

  <!-- Right bracket arm (folds out to the right, on the right face) -->
  <g filter="url(#soft-glow)">
    <!-- Horizontal arm — coming off right face -->
    <rect x="148" y="63" width="30" height="7" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <!-- Mounting plate at end -->
    <rect x="171" y="55" width="9" height="23" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <!-- Mounting holes on plate -->
    <circle cx="175.5" cy="61" r="1.8" fill="none" stroke="#00aaff" stroke-width="0.9"/>
    <circle cx="175.5" cy="71" r="1.8" fill="none" stroke="#00aaff" stroke-width="0.9"/>
  </g>

  <!-- Top bracket bar (across the top face — rear bar) -->
  <g filter="url(#soft-glow)">
    <rect x="60" y="23" width="78" height="9" rx="2.5" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <circle cx="65" cy="27.5" r="2" fill="none" stroke="#00aaff" stroke-width="0.9"/>
    <circle cx="133" cy="27.5" r="2" fill="none" stroke="#00aaff" stroke-width="0.9"/>
  </g>

  <!-- Neon edge highlights on box faces -->
  <g filter="url(#neon-glow)">
    <rect x="35" y="52" width="95" height="82" rx="2" fill="none" stroke="#00aaff" stroke-width="0.7"/>
    <polygon points="35,52 130,52 148,30 53,30" fill="none" stroke="#00aaff" stroke-width="0.7"/>
    <polygon points="130,52 148,30 148,112 130,134" fill="none" stroke="#00aaff" stroke-width="0.7"/>
  </g>

  <!-- Text label -->
  <text x="100" y="151" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#00aaff" text-anchor="middle" letter-spacing="2" filter="url(#neon-glow)">BACK-CAN SPEAKER</text>
</svg>
