<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#002255"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="160" fill="#050510" rx="12"/>

  <!-- Left panel (front face — flat, slightly tilted) -->
  <g filter="url(#soft-glow)">
    <polygon points="30,28 88,22 88,130 30,136" fill="#0a1a35" stroke="#00aaff" stroke-width="1.5"/>
    <!-- subtle horizontal lines on left panel -->
    <line x1="32" y1="50" x2="86" y2="46" stroke="#003a70" stroke-width="0.8"/>
    <line x1="32" y1="62" x2="86" y2="58" stroke="#003a70" stroke-width="0.8"/>
    <line x1="32" y1="74" x2="86" y2="70" stroke="#003a70" stroke-width="0.8"/>
    <line x1="32" y1="86" x2="86" y2="82" stroke="#003a70" stroke-width="0.8"/>
    <line x1="32" y1="98" x2="86" y2="94" stroke="#003a70" stroke-width="0.8"/>
    <line x1="32" y1="110" x2="86" y2="106" stroke="#003a70" stroke-width="0.8"/>
  </g>

  <!-- Right panel (back unit — angled) -->
  <g filter="url(#soft-glow)">
    <polygon points="92,18 162,28 162,132 92,130" fill="#0a1a35" stroke="#00aaff" stroke-width="1.5"/>

    <!-- Ventilation slats -->
    <rect x="100" y="30" width="50" height="4" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
    <rect x="100" y="38" width="50" height="4" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
    <rect x="100" y="46" width="50" height="4" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>

    <!-- Label box -->
    <rect x="100" y="56" width="50" height="36" rx="2" fill="#001840" stroke="#00aaff" stroke-width="1"/>

    <!-- Bar graph icon (like BLENDS logo) -->
    <rect x="108" y="68" width="4" height="12" rx="1" fill="#00ff88"/>
    <rect x="114" y="64" width="4" height="16" rx="1" fill="#00ddff"/>
    <rect x="120" y="60" width="4" height="20" rx="1" fill="#0088ff"/>
    <rect x="126" y="64" width="4" height="16" rx="1" fill="#00ddff"/>
    <rect x="132" y="68" width="4" height="12" rx="1" fill="#00ff88"/>

    <!-- Label text -->
    <text x="125" y="100" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#00aaff" text-anchor="middle" letter-spacing="1">INVISIBLE</text>

    <!-- More slats below -->
    <rect x="100" y="98" width="50" height="3.5" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
    <rect x="100" y="105" width="50" height="3.5" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
    <rect x="100" y="112" width="50" height="3.5" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
    <rect x="100" y="119" width="50" height="3.5" rx="1" fill="#003d80" stroke="#0066cc" stroke-width="0.5"/>
  </g>

  <!-- Neon edge highlights -->
  <g filter="url(#neon-glow)">
    <polygon points="30,28 88,22 88,130 30,136" fill="none" stroke="#00aaff" stroke-width="1"/>
    <polygon points="92,18 162,28 162,132 92,130" fill="none" stroke="#00aaff" stroke-width="1"/>
  </g>

  <!-- Corner screws hint (neon dots) -->
  <circle cx="34" cy="32" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="84" cy="26" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="34" cy="132" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="84" cy="126" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="96" cy="22" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="158" cy="32" r="2" fill="#00aaff" filter="url(#neon-glow)"/>
  <circle cx="158" cy="128" r="2" fill="#00aaff" filter="url(#neon-glow)"/>

  <!-- Text label -->
  <text x="100" y="152" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#00aaff" text-anchor="middle" letter-spacing="2" filter="url(#neon-glow)">INVISIBLE SPEAKER</text>
</svg>
