<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Landscape Category -->
  <!-- Back mountains (far, faint) -->
  <path d="M 0 58 L 18 28 L 36 58" fill="none" stroke="#4d9ef6" stroke-width="1" stroke-linejoin="round" opacity="0.25"/>
  <path d="M 30 58 L 52 18 L 74 58" fill="none" stroke="#4d9ef6" stroke-width="1" stroke-linejoin="round" opacity="0.25"/>
  <!-- Mid mountains -->
  <path d="M 8 65 L 28 38 L 48 65" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linejoin="round" opacity="0.55"/>
  <path d="M 38 65 L 62 22 L 80 58" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linejoin="round" opacity="0.55"/>
  <!-- Front mountain (tallest, most prominent) -->
  <path d="M 18 70 L 40 30 L 62 70" fill="none" stroke="#4d9ef6" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Speaker on front mountain peak -->
  <circle cx="40" cy="30" r="4" fill="none" stroke="#4d9ef6" stroke-width="1.5"/>
  <circle cx="40" cy="30" r="1.5" fill="#4d9ef6"/>
  <!-- Speaker arcs -->
  <path d="M 34 24 Q 40 18 46 24" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <path d="M 31 21 Q 40 12 49 21" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Plants left base -->
  <line x1="22" y1="70" x2="22" y2="62" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <path d="M 22 66 Q 18 62 16 64" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <path d="M 22 64 Q 26 60 28 62" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <!-- Plants right base -->
  <line x1="58" y1="70" x2="58" y2="62" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <path d="M 58 66 Q 54 62 52 64" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <path d="M 58 64 Q 62 60 64 62" fill="none" stroke="#4d9ef6" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
</svg>
