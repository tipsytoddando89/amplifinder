  <!-- Speaker grille dots row -->
  <circle cx="22" cy="39" r="2" fill="#4d9ef6" opacity="0.8"/>
  <circle cx="30" cy="39" r="2" fill="#4d9ef6" opacity="0.8"/>
  <circle cx="38" cy="39" r="2" fill="#4d9ef6" opacity="0.8"/>
  <circle cx="46" cy="39" r="2" fill="#4d9ef6" opacity="0.8"/>
  <circle cx="54" cy="39" r="2" fill="#4d9ef6" opacity="0.8"/>
  <!-- Status indicator -->
  <circle cx="64" cy="39" r="2" fill="rgba(77,158,246,0.3)" stroke="#4d9ef6" stroke-width="1"/>
  <!-- Small sub below -->
