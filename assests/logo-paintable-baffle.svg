<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2244"/>
      <stop offset="100%" stop-color="#091830"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="160" fill="#050510" rx="12"/>

  <!-- === FLAT PAINTABLE BAFFLE PANEL === -->

  <!-- Right edge (thickness shadow) -->
  <rect x="130" y="17" width="5" height="128" rx="1" fill="#040e1c" stroke="#003a5a" stroke-width="0.8"/>
  <!-- Bottom edge (thickness shadow) -->
  <rect x="65" y="140" width="65" height="5" rx="1" fill="#040e1c" stroke="#003a5a" stroke-width="0.8"/>

  <!-- Main panel face (portrait rectangle) -->
  <rect x="65" y="17" width="65" height="123" rx="3" fill="url(#panel-face)" stroke="#00aaff" stroke-width="1.5" filter="url(#soft-glow)"/>

  <!-- Subtle surface texture lines (suggest paintable drywall) -->
  <line x1="72" y1="17" x2="72" y2="140" stroke="#0a2040" stroke-width="0.6" opacity="0.6"/>
  <line x1="82" y1="17" x2="82" y2="140" stroke="#0a2040" stroke-width="0.5" opacity="0.4"/>
  <line x1="92" y1="17" x2="92" y2="140" stroke="#0a2040" stroke-width="0.5" opacity="0.4"/>
  <line x1="103" y1="17" x2="103" y2="140" stroke="#0a2040" stroke-width="0.5" opacity="0.4"/>
  <line x1="113" y1="17" x2="113" y2="140" stroke="#0a2040" stroke-width="0.5" opacity="0.4"/>
  <line x1="123" y1="17" x2="123" y2="140" stroke="#0a2040" stroke-width="0.6" opacity="0.6"/>

  <!-- Mounting holes — top row -->
  <circle cx="74" cy="26" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="97.5" cy="26" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="121" cy="26" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>

  <!-- Mounting holes — bottom row -->
  <circle cx="74" cy="131" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="97.5" cy="131" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="121" cy="131" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>

  <!-- Mounting holes — left column -->
  <circle cx="73" cy="50" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="73" cy="78.5" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="73" cy="107" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>

  <!-- Mounting holes — right column -->
  <circle cx="122" cy="50" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="122" cy="78.5" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>
  <circle cx="122" cy="107" r="2.5" fill="#030d1e" stroke="#00aaff" stroke-width="1" filter="url(#soft-glow)"/>

  <!-- Neon edge highlight on panel -->
  <rect x="65" y="17" width="65" height="123" rx="3" fill="none" stroke="#00aaff" stroke-width="0.8" filter="url(#neon-glow)"/>

  <!-- Text label -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#00aaff" text-anchor="middle" letter-spacing="2" filter="url(#neon-glow)">PAINTABLE BAFFLE</text>
</svg>
