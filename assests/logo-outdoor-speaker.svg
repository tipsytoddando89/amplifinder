<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dot-grid" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1" fill="#00aaff" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="200" height="160" fill="#050510" rx="12"/>

  <!-- Main body (front face + top face only, no bottom) -->
  <g filter="url(#soft-glow)">
    <!-- Front face -->
    <polygon points="40,55 160,55 160,105 40,105" fill="#051a3a" stroke="#00aaff" stroke-width="1.2"/>
    <!-- Top face -->
    <polygon points="52,28 148,28 160,55 40,55" fill="#062040" stroke="#00aaff" stroke-width="1.2"/>
  </g>

  <!-- Grille on front face (square + dot pattern) -->
  <g filter="url(#soft-glow)">
    <rect x="82" y="65" width="36" height="36" rx="4" fill="#001020" stroke="#00aaff" stroke-width="1"/>
    <rect x="84" y="67" width="32" height="32" rx="3" fill="url(#dot-grid)" opacity="0.9"/>
    <!-- Grille border highlight -->
    <rect x="82" y="65" width="36" height="36" rx="4" fill="none" stroke="#00ccff" stroke-width="0.8"/>
  </g>

  <!-- Left bracket arm -->
  <g filter="url(#soft-glow)">
    <rect x="14" y="72" width="28" height="8" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <rect x="10" y="66" width="8" height="20" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <circle cx="14" cy="71" r="1.5" fill="none" stroke="#00aaff" stroke-width="0.8"/>
    <circle cx="14" cy="81" r="1.5" fill="none" stroke="#00aaff" stroke-width="0.8"/>
  </g>

  <!-- Right bracket arm -->
  <g filter="url(#soft-glow)">
    <rect x="158" y="72" width="28" height="8" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <rect x="182" y="66" width="8" height="20" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <circle cx="186" cy="71" r="1.5" fill="none" stroke="#00aaff" stroke-width="0.8"/>
    <circle cx="186" cy="81" r="1.5" fill="none" stroke="#00aaff" stroke-width="0.8"/>
  </g>

  <!-- Top bracket (rear mounting bar) -->
  <g filter="url(#soft-glow)">
    <rect x="55" y="20" width="90" height="10" rx="3" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <rect x="50" y="17" width="10" height="16" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <rect x="140" y="17" width="10" height="16" rx="2" fill="#041530" stroke="#00aaff" stroke-width="1"/>
    <circle cx="55" cy="25" r="2" fill="none" stroke="#00aaff" stroke-width="0.8"/>
    <circle cx="145" cy="25" r="2" fill="none" stroke="#00aaff" stroke-width="0.8"/>
  </g>

  <!-- Screws on front face corners -->
  <circle cx="47" cy="62" r="1.5" fill="none" stroke="#0066aa" stroke-width="0.8"/>
  <circle cx="153" cy="62" r="1.5" fill="none" stroke="#0066aa" stroke-width="0.8"/>
  <circle cx="47" cy="98" r="1.5" fill="none" stroke="#0066aa" stroke-width="0.8"/>
  <circle cx="153" cy="98" r="1.5" fill="none" stroke="#0066aa" stroke-width="0.8"/>

  <!-- Neon edge highlights -->
  <g filter="url(#neon-glow)">
    <polygon points="40,55 160,55 160,105 40,105" fill="none" stroke="#00aaff" stroke-width="0.8"/>
    <polygon points="52,28 148,28 160,55 40,55" fill="none" stroke="#00aaff" stroke-width="0.8"/>
    <rect x="82" y="65" width="36" height="36" rx="4" fill="none" stroke="#00ddff" stroke-width="0.8"/>
  </g>

  <!-- Text label -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#00aaff" text-anchor="middle" letter-spacing="2" filter="url(#neon-glow)">MINIMAL OPENING</text>
</svg>
