<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Performance Category -->
  <!-- Tower speaker body -->
  <rect x="28" y="16" width="24" height="40" rx="4" fill="none" stroke="#4d9ef6" stroke-width="1.5"/>
  <!-- Tweeter (top) -->
  <circle cx="40" cy="24" r="4" fill="none" stroke="#4d9ef6" stroke-width="1.2"/>
  <circle cx="40" cy="24" r="1.5" fill="#4d9ef6"/>
  <!-- Mid driver -->
  <circle cx="40" cy="35" r="5.5" fill="none" stroke="#4d9ef6" stroke-width="1.2"/>
  <circle cx="40" cy="35" r="2" fill="rgba(77,158,246,0.2)" stroke="#4d9ef6" stroke-width="1"/>
  <!-- Woofer (bottom) -->
  <circle cx="40" cy="47" r="5" fill="none" stroke="#4d9ef6" stroke-width="1.2" opacity="0.7"/>
  <circle cx="40" cy="47" r="1.8" fill="rgba(77,158,246,0.15)" stroke="#4d9ef6" stroke-width="1" opacity="0.8"/>
  <!-- Sound waves left -->
  <path d="M 24 28 Q 20 34 24 40" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 20 24 Q 14 34 20 44" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Sound waves right -->
  <path d="M 56 28 Q 60 34 56 40" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 60 24 Q 66 34 60 44" fill="none" stroke="#4d9ef6" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
</svg>
