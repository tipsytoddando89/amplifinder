<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US CI Doorbell and Security Systems</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }

  h1 {
    color: #c9a84c;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 56px;
  }

  .timeline {
    display: flex;
    align-items: flex-start;
    width: 100%;
    max-width: 1100px;
    position: relative;
  }

  /* Horizontal spine */
  .timeline::before {
    content: '';
    position: absolute;
    top: 28px;
    left: 80px;
    right: 80px;
    height: 2px;
    background: linear-gradient(90deg, #5a4010, #c9a84c, #5a4010);
  }

  .section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Dot on the spine */
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #c9a84c;
    border: 3px solid #111;
    box-shadow: 0 0 0 2px #c9a84c;
    z-index: 1;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c9a84c;
    margin-bottom: 20px;
    text-align: center;
  }

  .card {
    background: #1a1a1a;
    border: 1px solid #2e2e2e;
    border-top: 2px solid #c9a84c;
    border-radius: 6px;
    width: calc(100% - 32px);
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    gap: 16px;
  }

  /* Image placeholder */
  .img-slot {
    width: 100%;
    aspect-ratio: 4/3;
    background: #222;
    border: 1px dashed #3a3a3a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    overflow: hidden;
  }

  .img-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .product-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* Text placeholder */
  .text-slot {
    width: 100%;
    color: #888;
    font-size: 0.8rem;
    line-height: 1.6;
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-style: italic;
  }

  /* Connector line from dot to card */
  .connector {
    width: 2px;
    height: 20px;
    background: #c9a84c;
    opacity: 0.5;
  }

  .img-pair {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .img-pair .img-slot {
    flex: 1;
  }
</style>
</head>
<body>

<h1>US CI Doorbell and Security Systems</h1>

<div class="timeline">

  <div class="section">
    <div class="dot"></div>
    <div class="label">Entry Level</div>
    <div class="connector"></div>
    <div class="card">
      <div class="img-slot">image</div>
    </div>
  </div>

  <div class="section">
    <div class="dot"></div>
    <div class="label">Design Focused</div>
    <div class="connector"></div>
    <div class="card">
      <div class="img-slot">image</div>
      <div class="text-slot">Description coming soon</div>
    </div>
  </div>

  <div class="section">
    <div class="dot"></div>
    <div class="label">Luxury</div>
    <div class="connector"></div>
    <div class="card">
      <div class="img-slot">image</div>
      <div class="text-slot">Description coming soon</div>
    </div>
  </div>

</div>

</body>
</html>
