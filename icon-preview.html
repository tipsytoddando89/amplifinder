<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0d0f14;font-family:'DM Sans',sans-serif;color:#f0ede8;padding:24px 16px;min-height:100vh;}
  h2{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#7a8090;margin-bottom:16px;}

  /* Icon grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px;}
  .card{background:#16191f;border:1px solid #2a2e38;border-radius:12px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all 0.15s;}
  .card:hover{border-color:#4d9ef6;background:#1e2229;}
  .card.current{border-color:rgba(77,158,246,0.25);}
  .icon-wrap{color:#4d9ef6;display:flex;align-items:center;justify-content:center;}
  .icon-wrap svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .label{font-size:10px;color:#7a8090;text-align:center;line-height:1.4;}
  .label.current-lbl{color:#4d9ef6;}

  /* Toolbar preview */
  .toolbar{display:flex;background:#16191f;border:1px solid #2a2e38;border-radius:12px;padding:6px 0;gap:0;align-items:center;margin-bottom:28px;}
  .tb-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#7a8090;cursor:pointer;padding:6px 4px 4px;border-radius:8px;}
  .tb-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tb-btn span{font-size:8px;letter-spacing:0.08em;text-transform:uppercase;font-family:'DM Sans',sans-serif;}
  .tb-btn.hilite{color:#4d9ef6;}
  .divider{height:32px;width:1px;background:#2a2e38;flex-shrink:0;}
</style>
</head>
<body>

<h2>Icon Options</h2>
<div class="grid">

  <!-- Current -->
  <div class="card current">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    </div>
    <div class="label current-lbl">Current<br>House</div>
  </div>

  <!-- Blueprint Grid -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    </div>
    <div class="label">Blueprint<br>Grid</div>
  </div>

  <!-- Clipboard -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1z"/><rect x="4" y="4" width="16" height="18" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>
    </div>
    <div class="label">Clipboard</div>
  </div>

  <!-- Open Book -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M2 4h8a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-8a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h8z"/></svg>
    </div>
    <div class="label">Open<br>Book</div>
  </div>

  <!-- Document w/ lines -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
    </div>
    <div class="label">Document</div>
  </div>

  <!-- Stacked Layers -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
    </div>
    <div class="label">Stacked<br>Layers</div>
  </div>

  <!-- Scroll / Plan Roll -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M4 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4"/><path d="M4 4a2 2 0 0 0 0 4"/><path d="M4 8a2 2 0 0 0 0 8"/><path d="M4 20a2 2 0 0 0 0-4"/><line x1="10" y1="8" x2="17" y2="8"/><line x1="10" y1="12" x2="17" y2="12"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
    </div>
    <div class="label">Plan Roll</div>
  </div>

  <!-- Checklist -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>
    </div>
    <div class="label">Checklist</div>
  </div>

</div>

<!-- Toolbar context - one row showing each option as the active "Project" tab -->
<h2>In Toolbar — each as the Project button</h2>

<!-- Row 1: Blueprint Grid + Clipboard -->
<div class="toolbar" style="margin-bottom:10px;">
  <button class="tb-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Find</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1z"/><rect x="4" y="4" width="16" height="18" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><path d="M2 4h8a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-8a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h8z"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><path d="M4 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4"/><path d="M4 4a2 2 0 0 0 0 4"/><path d="M4 8a2 2 0 0 0 0 8"/><path d="M4 20a2 2 0 0 0 0-4"/><line x1="10" y1="8" x2="17" y2="8"/><line x1="10" y1="12" x2="17" y2="12"/><line x1="10" y1="16" x2="14" y2="16"/></svg><span>Project</span></button>
  <div class="divider"></div>
  <button class="tb-btn hilite"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg><span>Project</span></button>
</div>

</body>
</html>
