<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSP Library — AmpliFINDER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#16191f;
      --surface2:#1e2229;
      --border:#2a2e38;
      --text:#f0ede8;
      --muted:#7a8090;
      --accent:#7d9bc1;
      --gold:#caab79;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;}

    /* Header */
    .header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);}
    .header-logo{height:26px;opacity:0.9;}
    .back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;padding:6px 0;transition:color 0.15s;}
    .back-btn:hover{color:var(--accent);}
    .back-btn svg{width:15px;height:15px;}

    /* Top bar */
    .top-bar{flex-shrink:0;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .page-title{font-size:17px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;}
    .select-wrap{position:relative;flex:1;min-width:200px;max-width:360px;}
    .select-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);width:15px;height:15px;}
    select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 36px 9px 12px;cursor:pointer;outline:none;transition:border-color 0.15s;}
    select:focus{border-color:var(--accent);}
    select option,select optgroup{background:#1a1e28;color:var(--text);}
    select optgroup{color:var(--muted);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;}
    .btn-dl{display:none;align-items:center;gap:6px;padding:9px 14px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.15s;white-space:nowrap;flex-shrink:0;}
    .btn-dl:hover{border-color:var(--accent);color:var(--accent);}
    .btn-dl svg{width:13px;height:13px;}
    .btn-dl.visible{display:flex;}

    /* Content area */
    .content-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}

    /* Placeholder */
    .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:3rem 1.5rem;}
    .placeholder svg{width:44px;height:44px;opacity:0.2;}
    .placeholder p{font-size:14px;text-align:center;line-height:1.5;}

    /* Product info card */
    .prod-card{display:none;flex-direction:column;padding:1.5rem;gap:0;}
    .prod-card.visible{display:flex;}

    .prod-header{margin-bottom:1.25rem;}
    .prod-eyebrow{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
    .prod-name{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
    .prod-cat{font-size:12px;color:var(--muted);margin-top:3px;}

    /* DSP file list */
    .file-section-label{font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:1.25rem;}
    .file-section-label:first-of-type{margin-top:0;}

    .file-list{display:flex;flex-direction:column;gap:8px;}

    .file-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color 0.15s;}
    .file-row:hover{border-color:var(--accent);}
    .file-icon{width:34px;height:34px;border-radius:8px;background:rgba(125,155,193,0.1);border:1px solid rgba(125,155,193,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .file-icon svg{width:16px;height:16px;stroke:var(--accent);fill:none;}
    .file-info{flex:1;min-width:0;}
    .file-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .file-meta{font-size:11px;color:var(--muted);margin-top:1px;}
    .file-dl{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:6px 10px;cursor:pointer;text-decoration:none;transition:all 0.15s;flex-shrink:0;white-space:nowrap;}
    .file-dl:hover{border-color:var(--accent);color:var(--accent);}
    .file-dl svg{width:11px;height:11px;}

    /* Coming soon state */
    .coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:3rem 1.5rem;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:0.5rem 0;}
    .coming-soon svg{width:36px;height:36px;opacity:0.2;}
    .coming-soon p{font-size:13px;color:var(--muted);line-height:1.5;}
    .coming-soon strong{color:var(--text);}
    .coming-soon-badge{display:inline-flex;align-items:center;padding:3px 10px;background:rgba(202,171,121,0.12);border:1px solid rgba(202,171,121,0.3);border-radius:20px;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;}
  </style>
</head>

    function onSelect() {
      var val = document.getElementById('prod-select').value;
      var placeholder = document.getElementById('placeholder');
      var card = document.getElementById('prod-card');

      if (!val) {
        placeholder.style.display = 'flex';
        card.classList.remove('visible');
        return;
      }

      var parts = val.split('|');
      var prod = parts[0];
      var cat  = parts[1];

      placeholder.style.display = 'none';
      card.classList.add('visible');

      document.getElementById('prod-eyebrow').textContent = cat;
      document.getElementById('prod-name').textContent = prod;
      document.getElementById('prod-cat').textContent = '';

      var filesEl = document.getElementById('prod-files');
      var files = DSP_FILES[prod];

      if (files && files.length) {
        var html = '<div class="file-section-label">Available Presets</div><div class="file-list">';
        files.forEach(function(f) {
          var url = '/assests/' + encodeURIComponent(f.file);
          html += '<div class="file-row">'
            + '<div class="file-icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 7h.01M11 7h6M7 11h.01M11 11h6"/></svg></div>'
            + '<div class="file-info"><div class="file-name">' + f.label + '</div>'
            + '<div class="file-meta">' + f.type + (f.description ? ' · ' + f.description : '') + '</div></div>'
            + '<a class="file-dl" href="' + url + '" download>'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
            + 'Download</a>'
            + '</div>';
        });
        html += '</div>';
        filesEl.innerHTML = html;
      } else {
        filesEl.innerHTML = '<div class="coming-soon">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 7h.01M11 7h6M7 11h.01M11 11h6"/></svg>'
          + '<p><strong>DSP presets for ' + prod + '</strong><br>are being prepared and will appear here.</p>'
          + '<span class="coming-soon-badge">Coming Soon</span>'
          + '</div>';
      }
    }
